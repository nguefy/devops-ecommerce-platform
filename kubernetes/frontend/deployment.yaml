apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: devops-ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: devops-ecommerce-frontend:latest
          imagePullPolicy: Never


          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"


          ports:
            - containerPort: 80
