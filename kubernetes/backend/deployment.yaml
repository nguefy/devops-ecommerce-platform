apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: devops-ecommerce-api:v2

          imagePullPolicy: Never

          ports:
            - containerPort: 8080


          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20

          env:
            - name: ConnectionStrings__Postgres
              value: "Host=postgres;Port=5432;Database=ecommerce;Username=postgres;Password=postgres"
