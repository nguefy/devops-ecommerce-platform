backend:
  replicaCount: 1

  image:
    repository: ghcr.io/nguefy/devops-ecommerce-platform/backend
    tag: latest
    pullPolicy: Always

  securityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  service:
    type: NodePort
    port: 8080
    targetPort: 8080

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi


postgres:
  image:
    repository: postgres
    tag: "16"

  storage:
    size: 2Gi

  service:
    port: 5432

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

  database:
    name: ecommerce
    user: postgres
    password: postgres


frontend:
  replicaCount: 1

  image:
    repository: ghcr.io/nguefy/devops-ecommerce-platform/frontend
    tag: latest
    pullPolicy: Always


  securityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  service:
    type: NodePort
    port: 80
    targetPort: 8080

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi    
