---
- name: Validate operating system family
  ansible.builtin.assert:
    that:
      - ansible_os_family == base_expected_os_family
    fail_msg: "Unsupported operating system family: {{ ansible_os_family }}"
    success_msg: "Operating system family is {{ ansible_os_family }}"

- name: Validate operating system distribution
  ansible.builtin.assert:
    that:
      - ansible_distribution == base_expected_distribution
    fail_msg: "Unsupported operating system distribution: {{ ansible_distribution }}"
    success_msg: "Operating system distribution is {{ ansible_distribution }}"
