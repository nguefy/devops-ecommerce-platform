grafana:
  enabled: true

  service:
    type: NodePort
    nodePort: 30030

  persistence:
    enabled: true
    size: 1Gi

  adminPassword: CHANGE_ME

  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://ecommerce-loki.observability.svc.cluster.local:3100
      isDefault: false
      editable: true

prometheus:
  prometheusSpec:
    retention: 7d

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

alertmanager:
  enabled: true

  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true
