name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore src/backend/DevOpsECommerce.Api/DevOpsECommerce.Api.csproj

      - name: Build
        run: dotnet build src/backend/DevOpsECommerce.Api/DevOpsECommerce.Api.csproj --no-restore --configuration Release

      - name: Verify build
        run: echo "Backend build successful"